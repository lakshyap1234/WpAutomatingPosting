# Both plugins' PHPUnit suites in wp-env (TESTING.md), on every push.
name: Tests

on:
  push:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  phpunit:
    name: PHPUnit (WordPress ${{ matrix.wordpress }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - wordpress: latest
            core: ''                            # .wp-env.json: the latest release
          - wordpress: '6.9'
            core: 'WordPress/WordPress#6.9'     # the Publisher's minimum
    env:
      WP_ENV_CORE: ${{ matrix.core }}
      WP_ENV: npx --yes @wordpress/env@11.16.0
    steps:
      - uses: actions/checkout@v5

      - name: PHP (only to install the test tools; tests run in wp-env's PHP 8.2)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Composer install (PHPUnit, polyfills)
        uses: ramsey/composer-install@v3

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Start wp-env
        id: wpenv
        run: $WP_ENV start                     # an empty WP_ENV_CORE is ignored

      # Each suite runs even when an earlier one failed, and keeps its output in
      # phpunit-<suite>.log for the annotations below.
      - name: Connector suite (OAuth, token permissions, REST)
        if: ${{ !cancelled() && steps.wpenv.outcome == 'success' }}
        run: |
          set -o pipefail
          $WP_ENV run tests-cli --env-cwd=cpub-repo vendor/bin/phpunit -c content-publisher-connector/phpunit.xml.dist 2>&1 | tee phpunit-connector.log

      - name: Golden files (samples/*.txt to expected blocks)
        if: ${{ !cancelled() && steps.wpenv.outcome == 'success' }}
        run: |
          set -o pipefail
          $WP_ENV run tests-cli --env-cwd=cpub-repo vendor/bin/phpunit -c content-publisher/phpunit.xml.dist --filter GoldenSamplesTest 2>&1 | tee phpunit-golden.log

      - name: Publisher suite
        if: ${{ !cancelled() && steps.wpenv.outcome == 'success' }}
        run: |
          set -o pipefail
          $WP_ENV run tests-cli --env-cwd=cpub-repo vendor/bin/phpunit -c content-publisher/phpunit.xml.dist 2>&1 | tee phpunit-publisher.log

      # The end of each failed suite's output as an annotation, so it shows on the
      # run's summary page (and in the API) without opening the full log.
      - name: Failures as annotations
        if: failure()
        run: |
          for log in phpunit-*.log; do
            [ -f "$log" ] || continue
            grep -qE '^(OK \(|OK, but)' "$log" && continue
            msg="$(tail -n 150 "$log" | sed 's/\x1b\[[0-9;]*m//g' | tail -c 30000)"
            msg="${msg//'%'/'%25'}"; msg="${msg//$'\r'/'%0D'}"; msg="${msg//$'\n'/'%0A'}"
            echo "::error title=${log%.log}::$msg"
          done

      - name: Logs on failure
        if: failure()
        run: $WP_ENV logs tests --watch=false || true

  # WordPress's Plugin Check on the Connector zip as it ships (DISTRIBUTION.md).
  # Errors fail the job; warnings are listed but don't. Not checked: the bundled
  # third-party libraries (vendor-prefixed/), and plugin_updater, which flags the
  # self-hosted update channel and only matters for a WordPress.org listing.
  plugin-check:
    name: Plugin Check (Connector)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WP_ENV: npx --yes @wordpress/env@11.16.0
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Build the zip
        run: |
          bin/build.sh zips connector
          mkdir -p ci-plugin
          unzip -q dist/content-publisher-connector-*.zip -d ci-plugin

      - name: Start WordPress with the zip and Plugin Check
        run: |
          cat > .wp-env.override.json <<'JSON'
          { "plugins": [ "./ci-plugin/content-publisher-connector", "https://downloads.wordpress.org/plugin/plugin-check.latest-stable.zip" ] }
          JSON
          $WP_ENV start

      - name: Plugin Check
        run: |
          set -o pipefail
          status=0
          $WP_ENV run cli wp plugin check content-publisher-connector \
            --exclude-directories=vendor-prefixed --exclude-checks=plugin_updater \
            --format=table 2>&1 | tee plugin-check.log || status=$?
          # Failed: an ERROR in the results, or the check itself didn't run.
          if [ "$status" -ne 0 ] || grep -qE '(^|[^A-Z_])ERROR([^A-Z_]|$)' plugin-check.log; then
            msg="$(sed 's/\x1b\[[0-9;]*m//g' plugin-check.log | tail -c 30000)"
            msg="${msg//'%'/'%25'}"; msg="${msg//$'\r'/'%0D'}"; msg="${msg//$'\n'/'%0A'}"
            echo "::error title=plugin-check::$msg"
            exit 1
          fi
